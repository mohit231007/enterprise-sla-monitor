name: Branch360 CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
        env:
          DATABASE_URL: file:./dev.db
      - run: npm run test --workspace @branch360/api
      - run: npm run build --workspace @branch360/api
      - run: npm run build --workspace @branch360/web
